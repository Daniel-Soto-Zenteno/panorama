{% extends 'base.html' %}{% block content %}<section class="narrow panel"><h1>Revisar {{ tipo }}</h1><h2>{{ obj.nombre }}{{ obj.titulo }}</h2><p>{{ obj.descripcion }}{{ obj.texto }}</p><p>Estado actual: {{ obj.estado }}</p><form method="post" class="form-fields">{% csrf_token %}{{ form.as_p }}<p><label for="decision">Decisión</label><select id="decision" name="decision">{% if obj.estado == 'PENDIENTE' %}<option value="APROBADO">Aprobar</option><option value="RECHAZADO">Rechazar</option>{% elif obj.estado == 'APROBADO' %}<option value="RETIRADO">Retirar del público</option>{% endif %}</select></p><button>Registrar decisión</button></form></section>{% endblock %}
